# One entry per Banking77 intent. Names must match intents.csv exactly.
# fraud_type null means the intent is ordinary. fraud_relevant in dim_intent
# is true exactly when fraud_type is set.
# risk_level is a property of the intent, not of a simulated user.

risk_levels: [low, medium, high]

# These lists are the contract. prepare_banking77.py fails if they disagree
# with the per-intent fraud_type and risk_level fields below.
fraud_type_roster:
  account_takeover:
    risk_level: high
    description: >
      Credential and profile changes that precede unauthorized transfers:
      PIN or passcode reset, a blocked PIN, edited personal details, or a lost phone.
    intents:
      - change_pin
      - passcode_forgotten
      - pin_blocked
      - edit_personal_details
      - lost_or_stolen_phone
  card_compromise:
    risk_level: high
    description: >
      Lost, stolen, or unrecognized card activity, including cash withdrawals
      the customer does not recognize.
    intents:
      - compromised_card
      - lost_or_stolen_card
      - card_payment_not_recognised
      - cash_withdrawal_not_recognised
  app_fraud_money_mule:
    risk_level: medium
    description: >
      Authorized-push and mule patterns: receiving funds, beneficiary blocks,
      cancelled transfers, and transfers the recipient never got.
    intents:
      - beneficiary_not_allowed
      - transfer_not_received_by_recipient
      - receiving_money
      - cancel_transfer
  identity_kyc_bypass:
    risk_level: high
    description: >
      Identity checks used to get past KYC: verify me, I cannot verify, why verify.
    intents:
      - verify_my_identity
      - unable_to_verify_identity
      - why_verify_identity
  virtual_card_abuse:
    risk_level: medium
    description: >
      Disposable and virtual card limits and failures, a common card-testing surface.
    intents:
      - get_disposable_virtual_card
      - disposable_card_limits
      - virtual_card_not_working
  refund_chargeback_abuse:
    risk_level: medium
    description: >
      Refund requests, refunds that do not appear, and reverted card payments.
    intents:
      - request_refund
      - "Refund_not_showing_up"
      - "reverted_card_payment?"

# Label order matches intents.csv. journey_stage groups an ordinary chatbot session.
